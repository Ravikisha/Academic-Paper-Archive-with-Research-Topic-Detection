<!DOCTYPE html>
<html>
<head>
    <title>Distributed File Storage</title>
</head>
<body>
    <h1>📤 Upload File</h1>
    <form action="/upload" method="post" enctype="multipart/form-data">
        <input type="file" name="file" required />
        <button type="submit">Upload</button>
    </form>
    <br />
    <a href="/downloads">📁 View Uploaded Files</a>
</body>
</html>
